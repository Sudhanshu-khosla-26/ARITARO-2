<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark container background for crisp tab contrast -->
  <rect width="64" height="64" rx="14" fill="#090E17" />
  
  <!-- Outer glowing shield edge (fills ~90% of the canvas) -->
  <path d="M32 6 L54 14 C54 36 44 49 32 58 C20 49 10 36 10 14 Z" 
        fill="url(#shieldGrad)" 
        stroke="#22D3EE" 
        stroke-width="1.5" />

  <!-- Inner dark plate -->
  <path d="M32 11 L49 17 C49 34 40 45 32 53 C24 45 15 34 15 17 Z" 
        fill="#0B132B" />

  <!-- Central cyber emblem / node -->
  <path d="M32 18 L43 23 L43 33 C43 40 37 45 32 48 C27 45 21 40 21 33 L21 23 Z" 
        fill="url(#coreGrad)" 
        opacity="0.9" />

  <!-- Central pulse core -->
  <circle cx="32" cy="30" r="5" fill="#FFFFFF" />
  <circle cx="32" cy="30" r="2.5" fill="#06B6D4" />
  
  <!-- Tech circuit accents -->
  <line x1="32" y1="35" x2="32" y2="43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="28" x2="23" y2="28" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />
  <line x1="38" y1="28" x2="41" y2="28" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />
</svg>